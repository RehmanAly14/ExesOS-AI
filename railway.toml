[build]
# Tell Railway to use the Dockerfile inside the server/ folder
dockerfilePath = "server/Dockerfile"
# Build context is the server directory so COPY instructions work correctly
buildContextDir = "server"

[deploy]
# Railway injects PORT automatically; this matches server.js fallback of 5000
startCommand = "./docker-entrypoint.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
